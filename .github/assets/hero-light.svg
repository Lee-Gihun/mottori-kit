<title id="t">mottori-kit: a topic picks up where it left off, weeks later</title>
<desc id="d">Day 1: 'Let's fix the checkout bug with a lock.' The agent writes it to checkout-bug.md. Then three weeks of other topics in the same conversation: the novel's fourth chapter, apartment viewings, a tax form, an email to the landlord, with six compactions. Day 22: 'Back to the checkout bug.' The agent reads the file and answers: lock chosen on day 1; next, the failing test. The novel and the apartment hunt keep files of their own.</desc>
<text x="40" y="76" font-size="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">mottori-kit</text>
<text x="40" y="120" font-size="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">One conversation for all your work: switch topics as you like,</text>
<text x="40" y="154" font-size="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">and each one picks up where it left off, weeks later.</text>
