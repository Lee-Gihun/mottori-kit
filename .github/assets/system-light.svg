<title id="t">What the agent reads, and how often</title>
<desc id="d">Four rows across one long conversation, compacted four times. AGENTS.md is loaded at the start and again after every compaction, rituals.md at fixed moments, a skill when its situation comes up, and the design records only when you ask why. What is read most often is kept shortest.</desc>
