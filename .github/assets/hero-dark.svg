<title id="t">mottori-kit: one long conversation for all your work</title>
<desc id="d">Over 21 days one conversation moves between a checkout bug at work, a novel's fourth chapter and an apartment hunt, and is compacted four times. Under it each topic has its own file on disk, a line no compaction cuts: written down when the topic first comes up, handed back whenever the talk returns to it.</desc>
<text x="40" y="76" font-size="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3" font-weight="700">mottori-kit</text>
<text x="40" y="120" font-size="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9198a1">One conversation for all your work: switch topics as you like,</text>
<text x="40" y="154" font-size="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9198a1">and each one picks up where it left off, weeks later.</text>
