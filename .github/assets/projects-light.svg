<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 452" width="1280" height="452" role="img" aria-labelledby="t d">
<title id="t">One folder per project; a repository of its own stays where it is</title>
<desc id="d">Inside your workspace, projects/ holds one folder per project, here novel, apartment and shop, and a map drawn from them. The shop's code repository stays outside at ~/code/shop, named in shop/README.md. Beside projects/, _private/apartment/ holds the lease, which Git never takes.</desc>
<text x="40" y="56" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600" letter-spacing="1.6">YOUR WORKSPACE</text>
<rect x="40" y="72" width="856" height="360" rx="14" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
<rect x="56" y="88" width="824" height="214" rx="12" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="76" y="126" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" font-weight="600">projects/</text>
<rect x="76" y="144" width="248" height="96" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="94" y="184" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" font-weight="600">novel/</text>
<text x="94" y="216" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">your old notes, moved in</text>
<rect x="344" y="144" width="248" height="96" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="362" y="184" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" font-weight="600">apartment/</text>
<text x="362" y="216" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">viewings, questions</text>
<rect x="612" y="144" width="248" height="96" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="630" y="184" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" font-weight="600">shop/</text>
<text x="630" y="216" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">the checkout bug</text>
<text x="76" y="278" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">projects/README.md: the map, redrawn by itself from these folders</text>
<rect x="56" y="330" width="824" height="76" rx="10" fill="#fbf1e3" stroke="#9a5b13" stroke-width="1.5"/>
<rect x="76" y="351" width="283.9" height="36" rx="6" fill="#ffffff"/>
<text x="217.9" y="376" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9a5b13" text-anchor="middle">_private/apartment/</text>
<text x="375.9" y="376" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">the lease: Git never takes it</text>
<text x="948" y="56" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13" font-weight="600" letter-spacing="1.6">OUTSIDE</text>
<rect x="948" y="144" width="292" height="96" rx="10" fill="#fbf1e3" stroke="#9a5b13" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="966" y="184" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9a5b13" font-weight="600">~/code/shop</text>
<text x="966" y="216" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">its own repository</text>
<line x1="864" y1="192" x2="942" y2="192" stroke="#9a5b13" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="948" y="276" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">named in shop/README.md,</text>
<text x="948" y="304" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">so the agent knows</text>
<text x="948" y="332" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">where it is</text>
</svg>
