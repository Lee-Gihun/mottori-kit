<text x="872.8" y="83" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" text-anchor="middle">review</text>
<rect x="975" y="58" width="214.4" height="36" rx="6" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
