<text x="407.1" y="233" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9a5b13" text-anchor="middle">tools/loop/sources/&lt;name&gt;.py</text>
<text x="202.7" y="272" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">its name · its weekly time · what one cycle runs · what it sends · what is watched</text>
