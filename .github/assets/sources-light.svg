<title id="t">A loop source is one Python file</title>
<desc id="d">The loop's steps run along the top. A source is one file on disk, tools/loop/sources/&lt;name&gt;.py, which says what it sends, its settings, its steps and what is watched. The loop reads it by name.</desc>
