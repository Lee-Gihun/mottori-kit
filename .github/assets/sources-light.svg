<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
<title id="t">A loop source is one Python file</title>
<desc id="d">The loop's steps run along the top. A source is one file on disk, tools/loop/sources/&lt;name&gt;.py, which says what it sends, its settings, its steps and what is watched. The loop reads it by name.</desc>
<text x="40" y="82" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600" letter-spacing="1.6">THE LOOP</text>
