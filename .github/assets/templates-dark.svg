<title id="t">Templates become your own files</title>
<desc id="d">Setup copies each of the kit's blank forms once into your files: config, rules, rituals and decisions into instance/, and the projects guide into projects/README.md. It never overwrites a file, and git pull never touches your copy.</desc>
