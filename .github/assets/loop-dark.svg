<title id="t">The improvement loop ends at a saved patch</title>
<desc id="d">Once a week: sources, a judge that picks at most two proposals, a build in a temporary copy, tests in a sandbox and a review of the patch. What it keeps is a patch file and a report on disk. It never writes into your folder; you or your agent apply the patch.</desc>
