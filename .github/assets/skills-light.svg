<title id="t">Skills open by themselves when their moment comes</title>
<desc id="d">One session drawn as growing context. Along it, skills open at their moments: now at the start, lenses before a decision, deep-pass for a decision that cannot be undone, plain-writing for text another person will read, recall to find what you said, large-jobs before a big job.</desc>
