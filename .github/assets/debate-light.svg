<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
<title id="t">A debate between two runtimes ends in one answer for you</title>
<desc id="d">Claude and Codex take turns: a proposal, an attack on its assumptions, a reply, a convergence. You receive one recommendation or the one decision still open, not the messages.</desc>
<text x="40" y="118" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600" letter-spacing="1.6">CLAUDE</text>
<line x1="154" y1="110" x2="890" y2="110" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="40" y="248" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600" letter-spacing="1.6">CODEX</text>
<line x1="154" y1="240" x2="890" y2="240" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="293.2" cy="110" r="9" fill="#a8b1bb"/>
<text x="293.2" y="88" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" text-anchor="middle">proposal</text>
<line x1="293.2" y1="110" x2="442.4" y2="240" stroke="#59636e" stroke-width="1.5"/>
<circle cx="442.4" cy="240" r="9" fill="#a8b1bb"/>
<text x="442.4" y="278" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" text-anchor="middle">attack its assumptions</text>
<line x1="442.4" y1="240" x2="591.6" y2="110" stroke="#59636e" stroke-width="1.5"/>
<circle cx="591.6" cy="110" r="9" fill="#a8b1bb"/>
<text x="591.6" y="88" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" text-anchor="middle">reply</text>
<line x1="591.6" y1="110" x2="740.8" y2="240" stroke="#59636e" stroke-width="1.5"/>
<circle cx="740.8" cy="240" r="9" fill="#a8b1bb"/>
<text x="740.8" y="278" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" text-anchor="middle">converge</text>
<line x1="754.8" y1="236" x2="929" y2="196.6" stroke="#9a5b13" stroke-width="1.5"/>
<path d="M936 195L928.2 201.4L926.2 192.6Z" fill="#9a5b13"/>
<rect x="940" y="120" width="300" height="130" rx="10" fill="#fbf1e3" stroke="#9a5b13" stroke-width="1.5"/>
<text x="960" y="160" font-size="22" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13" font-weight="700">for you</text>
<text x="960" y="194" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">one recommendation, or</text>
<text x="960" y="222" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">the one decision still open</text>
<text x="40" y="340" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">Agreement improves a proposal; it does not prove it.</text>
</svg>
