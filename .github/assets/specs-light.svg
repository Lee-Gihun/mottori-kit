<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">Each decision record names the tests that hold it</title>
<desc id="d">A decision record, such as DR-093, 'The owner's work lives in projects/, one folder per project', gives the decision, the context it came from and the evidence: the test that holds it. A check fails when a named test is gone. Records are added one after another and never rewritten.</desc>
<rect x="40" y="32" width="760" height="290" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<rect x="52" y="44" width="760" height="290" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<rect x="64" y="56" width="760" height="290" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="88" y="96" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#59636e">decision record DR-093</text>
<text x="88" y="132" font-size="22" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">The owner's work lives in projects/,</text>
<text x="88" y="162" font-size="22" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" font-weight="700">one folder per project</text>
<text x="88" y="212" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600">Decision</text>
<text x="214" y="212" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">every folder there is a project, described in its README</text>
<text x="88" y="252" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600">Context</text>
<text x="214" y="252" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">thirty folders at the root, one project in three places</text>
<text x="88" y="292" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e" font-weight="600">Evidence</text>
<text x="214" y="292" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9a5b13">test_projects.py</text>
<line x1="435.1" y1="286" x2="886.8" y2="286" stroke="#9a5b13" stroke-width="1.5"/>
<path d="M894 286L885 290.5L885 281.5Z" fill="#9a5b13"/>
<rect x="900" y="268" width="242.2" height="36" rx="6" fill="#ffffff"/>
<text x="1021.1" y="293" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9a5b13" text-anchor="middle">test_projects.py</text>
<rect x="884" y="252" width="274.2" height="68" rx="10" fill="#fbf1e3" stroke="#9a5b13" stroke-width="1.5"/>
<rect x="900" y="268" width="242.2" height="36" rx="6" fill="#ffffff"/>
<text x="1021.1" y="293" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9a5b13" text-anchor="middle">test_projects.py</text>
<text x="884" y="356" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">if this test is gone,</text>
<text x="884" y="382" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9a5b13">a check fails</text>
<text x="40" y="398" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#59636e">Records are added one after another, never rewritten. A later record names the one it changes.</text>
</svg>
