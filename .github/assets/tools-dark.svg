<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
<title id="t">What runs when, and what it does for you</title>
<desc id="d">Along one conversation: at the start and after each compaction the current state is put in front of the agent; while you work each decision is written down and your own earlier words can be found; at the end of each reply a broken link or forgotten state stops it once; at a commit or push broken links and private files are kept out. Any time, you can check the whole setup.</desc>
