<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
<title id="t">What runs when, and what it does for you</title>
<desc id="d">Along one conversation: when a session starts or after a compaction, where things stand is put in front of the agent; while you work, the agent writes each decision in one line; when a reply ends, a broken link or a document handed over unread stops it once; at a commit or push, private files are kept out. Any time, you can check the setup, find your own words, or hand a task to a worker.</desc>
