<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
<title id="t">Which command runs when</title>
<desc id="d">One session drawn as growing context, with the commands that run at each moment: now.py and tasks.py at session start, now.py log and recall.py while you work, gate.py and deliver.py at the end of a turn, gate.py at a commit and enforce.py at a push, and doctor.py whenever you want a check.</desc>
