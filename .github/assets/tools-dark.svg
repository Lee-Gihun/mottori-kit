<text x="40" y="236" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9198a1" font-weight="600" letter-spacing="1.6">BY ITSELF</text>
<circle cx="249.6" cy="102" r="5" fill="#e6edf3"/>
<line x1="249.6" y1="128" x2="249.6" y2="146" stroke="#3d444d" stroke-width="1.5"/>
<text x="240" y="170" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3" font-weight="600">start, or after a compaction</text>
<text x="240" y="204" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">puts where things stand</text>
<text x="240" y="228" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">in front of the agent</text>
<text x="240" y="252" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">now.py</text>
<text x="240" y="296" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">says what is still running</text>
<text x="240" y="320" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">tasks.py</text>
<circle cx="576.5" cy="85.3" r="5" fill="#e6edf3"/>
<line x1="576.5" y1="128" x2="576.5" y2="146" stroke="#3d444d" stroke-width="1.5"/>
<text x="496" y="170" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3" font-weight="600">while you work</text>
<text x="496" y="204" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">writes each decision</text>
<text x="496" y="228" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">down in one line</text>
<text x="496" y="252" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">now.py log</text>
<text x="496" y="296" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">finds your own words</text>
<text x="496" y="320" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">from weeks ago</text>
<text x="496" y="344" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">recall.py</text>
<circle cx="903.5" cy="68.7" r="5" fill="#e6edf3"/>
<line x1="903.5" y1="128" x2="903.5" y2="146" stroke="#3d444d" stroke-width="1.5"/>
<text x="746" y="170" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3" font-weight="600">each reply ends</text>
<text x="746" y="204" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">stops it once on a broken</text>
<text x="746" y="228" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">link or stale state</text>
<text x="746" y="252" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">gate.py</text>
<text x="746" y="296" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">reads the reply once</text>
<text x="746" y="320" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">before you do</text>
<text x="746" y="344" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">deliver.py</text>
<circle cx="1230.4" cy="52" r="5" fill="#e6edf3"/>
<line x1="1230.4" y1="128" x2="1230.4" y2="146" stroke="#3d444d" stroke-width="1.5"/>
<text x="996" y="170" font-size="19" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3" font-weight="600">commit, push</text>
<text x="996" y="204" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">keeps broken links</text>
<text x="996" y="228" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">out of a commit</text>
<text x="996" y="252" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">gate.py</text>
<text x="996" y="296" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">keeps private files</text>
<text x="996" y="320" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">out of a push</text>
<text x="996" y="344" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">enforce.py</text>
<rect x="40" y="420" width="1200" height="84" rx="12" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="60" y="454" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9198a1" font-weight="600" letter-spacing="1.6">YOU, ANY TIME</text>
<text x="276.4" y="454" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">checks the whole setup</text>
<text x="276.4" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">doctor.py</text>
<text x="590.9" y="454" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">turns optional parts on or off</text>
<text x="590.9" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">options.py</text>
<text x="905.5" y="454" font-size="18" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e6edf3">hands a task to a fresh worker</text>
<text x="905.5" y="480" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9198a1">fresh_worker.py</text>
<text x="40" y="540" font-size="20" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#9198a1">The top row runs by itself from hooks: commands the agent's runtime starts at that moment.</text>
</svg>
