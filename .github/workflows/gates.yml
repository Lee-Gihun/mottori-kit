name: gates

# The checks before publication, on Linux and macOS; local hooks can be bypassed.

on:
  push:
    branches: [main]
  pull_request:

# No step writes to the repository, so the job token needs read access only.
permissions:
  contents: read

jobs:
  gates:
    # Only the kit's own repository and its forks, which keep its name; a user's workspace pushed
    # under another name runs nothing here.
    if: github.event.repository.name == 'mottori-kit'
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is not published for the newest Ubuntu runner image, so its Linux job pins
        # the last image that carries it.
        include:
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The runner is the one list of suites: every test file with an empty HOME and stdin from
      # /dev/null, then the full mutation run, every engine test inside an installed instance, and
      # the fresh install.
      - name: regression suites
        # The runner gives each file an empty HOME, so fixture commits take their identity from here.
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: python3 tools/tests/run.py --full
      - name: static checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 tools/linkcheck.py
          python3 tools/dev/evidencecheck.py
          # A clean checkout has no working-copy diff, so check what the event submitted. A push
          # that creates the branch has no before commit; the empty tree stands in for it.
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=$(git hash-object -t tree /dev/null) ;; esac
          git diff --check "$BASE" HEAD
